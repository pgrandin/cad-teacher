# Deploy to GitHub Pages on every push to main: test, stamp the commit, cache-bust, publish.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.mjs
      - name: Stamp version and cache-bust
        # Pages lets browsers cache files for 10 minutes. Loading every app module as file.js?v=<sha>
        # (through the import map) makes a plain reload pick up a new deploy right away.
        run: |
          v=${GITHUB_SHA::7}
          echo "export const VERSION = '$v';" > version.js
          node -e '
            const fs = require("fs"), v = process.argv[1];
            const files = [...fs.readdirSync(".").filter(f => f.endsWith(".js")), ...fs.readdirSync("locales").map(f => "locales/" + f)];
            const imports = { three: "./vendor/three.module.js", ...Object.fromEntries(files.map(f => ["./" + f, `./${f}?v=${v}`])) };
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/<script type="importmap">[^<]*<\/script>/, `<script type="importmap">${JSON.stringify({ imports })}</script>`)
                       .replace(`src="app.js"`, `src="app.js?v=${v}"`);
            fs.writeFileSync("index.html", html);
          ' "$v"
          grep -c "?v=$v" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
